"$schema" = "https://open-api.netlify.com/netlify.schema.json"

[build]
  command = "npm test"
  publish = "public"

[functions]
  directory = "netlify/functions"
  node_bundler = "esbuild"
  included_files = ["src/**", "public/**"]

[build.environment]
  DATA_DIR = "/tmp/cheng-ledger-data"
  USE_NODE_SQLITE = "1"
  NODE_VERSION = "22"

[[redirects]]
  from = "/api/*"
  to = "/.netlify/functions/app/:splat"
  status = 200
  force = true

[[redirects]]
  from = "/*"
  to = "/index.html"
  status = 200
